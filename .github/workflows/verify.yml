# SPDX-License-Identifier: MIT
# Verification for the Zig package in this repository.
#
# This file is written for this repository and names this repository's gates. It
# does not replace or retarget any upstream CI: LuaJIT ships no `.github`
# directory and no CI configuration at all, so there is none to leave alone and
# none that could have been retargeted at this repository's infrastructure. Every
# step below names a command from `build.zig`.
#
# Four jobs, four different questions:
#
#   native     does the complete generator chain -- minilua, genversion, DynASM,
#              buildvm, the six generated headers -- run here, do the JIT, the
#              FFI and the `jit.*` module set work in the delivered CLI, and do
#              two C translation units reach the *installed* headers and library
#   delivery   does the installed closure come out complete -- the CLI, the
#              library, all six public headers, the nineteen `jit` Lua modules,
#              the man page, the pkg-config file and the licence -- in all four
#              optimize modes, for a static artifact and for a shared one
#   cross      does the whole graph compile and link for each of the six targets,
#              with the two LuaJIT cannot support asserted rather than dropped
#   consumer   does the published module resolve from a package that did not
#              write it
#
# Three things this workflow deliberately does not do.
#
# It does not mark any target `continue-on-error`. Nothing here has been
# observed to fail, and pre-labelling a failure as expected is a claim about a
# run that never happened. If a target turns out to be unsupported, the fix is
# to record that in this file with the compiler output that showed it, not to
# silence it.
#
# It does not drop a target out of the cross matrix when `-Dlinkage=dynamic` is
# asked for: `zig build check` compiles the artifact kind that was selected for
# every target, so a target that cannot produce a shared object fails here with
# its own compiler output rather than being quietly answered with the static
# artifact instead.
#
# It does not exercise a system-library mode. `build.zig` offers none, and
# `build.zig`'s header says why at length: LuaJIT's published surface here is
# not only a library but the CLI, the `jit.*` module set, the generated
# `jit/vmdef.lua` and the rolling version symbol, and all of those belong to one
# build. Linking an installed `libluajit-5.1` against this repository's headers
# is exactly the header/ABI mismatch the fork contract forbids.

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: native build, generator chain and delivered CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Builds `minilua`, runs `genversion.lua` and DynASM, builds `buildvm`,
      # runs it six times, and compiles the 68 translation units of the library
      # and the CLI. Compiling it is not the same as using it, which is what the
      # next step is for.
      - name: build and install
        run: zig build --summary all

      # The delivered CLI, run. `build_support/native_selfcheck.lua` checks the
      # things that separate LuaJIT from a stock Lua interpreter: that `jit.on`
      # exists, that `jit.attach(cb, "trace")` observes a compiled trace, that
      # the FFI's `ffi.cdef`/`ffi.C` path works, that `string.dump` and
      # `loadstring` round-trip bytecode, and that the installed `jit.*` modules
      # load from `LUA_LJDIR`.
      #
      # The script exits non-zero on any failure and names each one, so a red run
      # here reads as a statement about the delivery rather than as "some assert
      # failed somewhere".
      - name: the delivered CLI is a JIT with an FFI and its jit modules
        run: zig build native-test --summary all

      # The only step that reads the *installed* tree. `build_support/header_check_a.c`
      # and `header_check_b.c` are compiled with the include directory and
      # library directory `etc/luajit.pc` reports and linked with `-lluajit-5.1`,
      # so a build whose archive is right but whose installed headers are missing,
      # stale or in the wrong directory fails here and passes everywhere else.
      # Two translation units, so a header set that only works from one file has
      # not passed either.
      - name: installed headers and library serve a two-unit C program
        run: zig build header-check --summary all

  delivery:
    name: installed closure, ${{ matrix.optimize }} and ${{ matrix.linkage }}
    runs-on: ubuntu-latest
    strategy:
      # Every combination, not a sample: the four optimize modes and the two
      # linkages reach different code in the library, in the generators' output
      # paths and in the archive.
      matrix:
        optimize: [Debug, ReleaseSafe, ReleaseSmall, ReleaseFast]
        linkage: [static, dynamic]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: build and install
        run: |
          zig build install \
            -Doptimize=${{ matrix.optimize }} \
            -Dlinkage=${{ matrix.linkage }} \
            --prefix "$PWD/out" \
            --summary all

      # The closure `Makefile:130-148` writes, named one path at a time rather
      # than counted, so a missing file names itself.
      #
      # `bin/luajit` is upstream's `INSTALL_TSYMNAME`. The library is
      # `libluajit-5.1.a` on a static build (`INSTALL_ANAME`) and
      # `libluajit-5.1.so.2.1.1788856981` with `.so.2` and `.so` beside it
      # (`INSTALL_SONAME`, `INSTALL_SOSHORT2`, `INSTALL_SOSHORT1`) on a shared
      # one. The headers are `include/luajit-2.1/{lua,luaconf,lualib,lauxlib,
      # lua.hpp,luajit}.h` -- `FILES_INC` (`Makefile:98`) into `INSTALL_DEFINC`
      # (`Makefile:42`), with `luajit.h` the generated one. The `jit` set is the
      # nineteen `FILES_JITLIB` modules (`Makefile:99-104`) under
      # `share/luajit-2.1/jit`, eighteen checked in and `vmdef.lua` generated.
      - name: the installed closure is complete
        run: |
          set -euo pipefail
          out="$PWD/out"
          test -x "$out/bin/luajit"
          if [ "${{ matrix.linkage }}" = static ]; then
            test -f "$out/lib/libluajit-5.1.a"
          else
            test -e "$out/lib/libluajit-5.1.so.2.1.1788856981"
            test -e "$out/lib/libluajit-5.1.so.2"
            test -e "$out/lib/libluajit-5.1.so"
          fi
          for h in lua.h luaconf.h lualib.h lauxlib.h lua.hpp luajit.h; do
            test -f "$out/include/luajit-2.1/$h"
          done
          for m in bc.lua bcsave.lua dump.lua p.lua v.lua zone.lua \
                   dis_x86.lua dis_x64.lua dis_arm.lua dis_arm64.lua dis_arm64be.lua \
                   dis_ppc.lua dis_mips.lua dis_mipsel.lua dis_mips64.lua \
                   dis_mips64el.lua dis_mips64r6.lua dis_mips64r6el.lua vmdef.lua; do
            test -f "$out/share/luajit-2.1/jit/$m"
          done
          test -f "$out/share/man/man1/luajit.1"
          test -f "$out/lib/pkgconfig/luajit.pc"
          test -f "$out/share/doc/luajit-2.1/COPYRIGHT"
          test -f "$out/share/doc/luajit-2.1/README.md"
          # This fork's own records, installed by `build.zig` rather than by a
          # packaging wrapper, so that one writer owns every installed path and
          # the binary cannot arrive without the terms it ships under.
          for r in NOTICE.md FORK-LICENSE.md UPSTREAM.md README.upstream.md; do
            test -f "$out/share/licenses/luajit/$r"
          done

      # The generated `luajit.h`, read rather than assumed.
      #
      # `genversion.lua:36` substitutes the pinned commit's POSIX timestamp for
      # `ROLLING`, so `LUAJIT_VERSION` is `LuaJIT 2.1.1788856981` and
      # `LUAJIT_VERSION_SYM` is `luaJIT_version_2_1_1788856981`
      # (`luajit_rolling.h:33`, `:35`). `Makefile:495`'s non-git branch reads the
      # checked-in `.relver`, which carries those same digits, so the two agree
      # without a git step anywhere in the build.
      - name: the generated version header carries the pinned snapshot timestamp
        run: |
          set -euo pipefail
          grep -q 'define LUAJIT_VERSION[[:space:]]*"LuaJIT 2.1.1788856981"' \
            "$PWD/out/include/luajit-2.1/luajit.h"
          grep -q 'define LUAJIT_VERSION_SYM[[:space:]]*luaJIT_version_2_1_1788856981' \
            "$PWD/out/include/luajit-2.1/luajit.h"

      # The pkg-config file names the release version, and it names the install
      # root by the file's own location instead of by a literal path.
      #
      # The installed `prefix=` is the one value this build re-derives rather
      # than substitutes, and both the rule it departs from and the place it
      # departs are readable in the tree. Upstream's `SED_PC` (`Makefile:86-91`)
      # writes `prefix=$(PREFIX)`, a root belonging to the machine that built
      # the tree; `build.zig`'s `addPkgConfig` writes `prefix=${pcfiledir}/../..`
      # instead, and the installed file is `<root>/lib/pkgconfig/luajit.pc`, so
      # `${pcfiledir}/../..` is `<root>` and `pkg-config` resolves it wherever
      # the tree is copied to. Every other field a consumer resolves from this
      # one -- `libdir`, `Cflags`, `Libs` -- is written in terms of `${prefix}`
      # already, so relocation needs no help from any of them.
      #
      # `libname` is *not* a substituted field. Upstream's template says
      # `libname=luajit-${abiver}` (`etc/luajit.pc:12`), `SED_PC` never rewrites
      # it, and neither does this build -- `pkg-config` expands the reference
      # from `abiver` (`etc/luajit.pc:6`) when it reads the metadata. Asserting
      # the expanded text would assert a line the file does not contain, so the
      # reference and the value it resolves from are asserted instead: together
      # they are what proves `-lluajit-5.1`.
      #
      # `INSTALL_LMOD` and `INSTALL_CMOD` are deliberately not asserted here.
      # Upstream's `SED_PC` never rewrites them, the template already spells
      # them in terms of `${prefix}`, and this build passes them through
      # untouched rather than writing a build machine's root into them. No
      # consumer reads them either: `Cflags:` is `-I${includedir}` and `Libs:`
      # is `-L${libdir} -l${libname}`, and upstream installs both module
      # directories empty.
      #
      # `-F` and `-x` on the `prefix=` line because the value is literal text:
      # as a basic regular expression its `.` would match any character.
      - name: the pkg-config file names its own location and this release version
        run: |
          set -euo pipefail
          pc="$PWD/out/lib/pkgconfig/luajit.pc"
          grep -qxF 'prefix=${pcfiledir}/../..' "$pc"
          grep -q '^relver=1788856981$' "$pc"
          grep -q "^includedir=\${prefix}/include/luajit-2.1\$" "$pc"
          grep -q '^abiver=5.1$' "$pc"
          grep -q '^libname=luajit-${abiver}$' "$pc"
          grep -q '^Cflags: -I\${includedir}$' "$pc"
          grep -q '^Libs: -L\${libdir} -l\${libname}$' "$pc"

      # Upstream's licence text ships beside the binary. A private repository
      # removes no upstream obligation, and the file is installed unmodified.
      - name: the upstream licence text is installed verbatim
        run: |
          set -euo pipefail
          cmp "$PWD/out/share/doc/luajit-2.1/COPYRIGHT" "$PWD/COPYRIGHT"

  cross:
    name: cross compile, six targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Two of the six -- RISC-V and WebAssembly -- are architectures LuaJIT
      # 2.1 does not support: the chain at `lj_arch.h:54-70` names x86, x64, ARM,
      # arm64, PPC, MIPS and MIPS64, and its `#else` at `lj_arch.h:69` is
      # `#error "Architecture not supported (in this version)"`.
      #
      # `check` does not drop them and does not pretend to compile them. For each
      # it runs the target's own preprocessor over `src/lj_arch.h` and *requires*
      # upstream's refusal, so a passing cell has observed the boundary rather
      # than asserted it. They are separate steps rather than one matrix row for
      # the same reason the rest are: a tolerated failure and a quietly dropped
      # target look identical from the outside.
      - name: x86_64-linux-gnu
        run: zig build check -Dtarget=x86_64-linux-gnu --summary all
      - name: aarch64-linux-gnu
        run: zig build check -Dtarget=aarch64-linux-gnu --summary all
      - name: aarch64-macos-none
        run: zig build check -Dtarget=aarch64-macos-none --summary all
      - name: x86_64-windows-gnu
        run: zig build check -Dtarget=x86_64-windows-gnu --summary all

      # LuaJIT 2.1 refuses these two, and this step is what observes that.
      - name: riscv64-linux-gnu is refused by lj_arch.h
        run: zig build check -Dtarget=riscv64-linux-gnu --summary all
      - name: wasm32-wasi is refused by lj_arch.h
        run: zig build check -Dtarget=wasm32-wasi --summary all

  consumer:
    name: the published module from a package that did not write it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: the consumer package builds against this one by relative path
        run: |
          set -euo pipefail
          # An explicit cache and prefix, so building the consumer does not write
          # into `consumer/` and change this repository's own package hash.
          cd consumer
          zig build run \
            --cache-dir "$PWD/.zig-cache" \
            --prefix "$PWD/zig-out" \
            --summary all